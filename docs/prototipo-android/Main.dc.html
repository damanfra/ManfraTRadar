<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Enxame — Descobrir</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1116}
a{color:#6EA8FF}a:hover{color:#9CC3FF}
input::placeholder{color:#8A93A0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #E6E9EE; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="flex: 0 0 auto; padding: 16px 16px 4px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="9" cy="10" r="5" fill="#6EA8FF"></circle><circle cx="19" cy="10" r="5" fill="#6EA8FF" opacity="0.7"></circle><circle cx="14" cy="19" r="5" fill="#6EA8FF" opacity="0.45"></circle></svg>
<h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Enxame</h1>
</div>
<button type="button" aria-label="Configurações" style="width: 44px; height: 44px; border-radius: 12px; background: none; border: 0; color: #C9CED6; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
</button>
</div>

<label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #171B22; border: 1px solid #272D37; border-radius: 12px; color: #9AA3AF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Buscar torrents" placeholder="Buscar em todas as fontes" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #E6E9EE; font: 400 15px 'IBM Plex Sans', sans-serif">
</label>

<div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #9AA3AF">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #5EE0A0"></span>3 fontes ativas · atualizado há 4 min</span>
<button type="button" style="height: 44px; padding: 0 4px; background: none; border: 0; color: #6EA8FF; font: 600 13px 'IBM Plex Sans', sans-serif; cursor: pointer">Gerenciar</button>
</div>
</header>

<div style="flex: 0 0 auto; display: flex; gap: 8px; padding: 0 16px; overflow-x: auto">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="flex: 0 0 auto; height: 44px; padding: 0; background: none; border: 0; cursor: pointer; display: flex; align-items: center"><span style="{{c.style}}">{{c.label}}</span></button>
</sc-for>
</div>

<div style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 4px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Em alta hoje <span style="font: 500 13px 'IBM Plex Mono', monospace; color: #9AA3AF">{{count}}</span></h2>
<button type="button" onClick="{{toggleSort}}" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 2px; background: none; border: 0; color: #C9CED6; font: 500 13px 'IBM Plex Sans', sans-serif; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>
{{sortLabel}}
</button>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; border-top: 1px solid #1C2129">
<sc-for list="{{items}}" as="item" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #1C2129">
<span style="width: 20px; flex: 0 0 auto; font: 500 13px 'IBM Plex Mono', monospace; color: #9AA3AF; text-align: right">{{item.rank}}</span>
<a href="Detalhes.dc.html" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #E6E9EE">
<span style="font-size: 15px; font-weight: 500; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{item.title}}</span>
<span style="font-size: 12px; color: #9AA3AF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{item.meta}}</span>
<span style="display: flex; gap: 14px; font: 500 12px 'IBM Plex Mono', monospace">
<span style="color: #5EE0A0">▲ {{item.seeds}}</span>
<span style="color: #FFA15C">▼ {{item.leech}}</span>
<span style="color: #9AA3AF">{{item.age}}</span>
</span>
</a>
<button type="button" aria-label="{{item.dlLabel}}" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: #18233A; border: 1px solid #2B3E63; color: #6EA8FF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
</button>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 40px 24px; text-align: center; font-size: 14px; color: #9AA3AF">Nada em alta nesta categoria agora.</p>
</sc-if>
</div>

<nav aria-label="Navegação principal" style="flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 64px; border-top: 1px solid #222831; background: #12151B">
<a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6EA8FF; font-size: 11px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
Descobrir
</a>
<a href="Downloads.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #9AA3AF; font-size: 11px; font-weight: 500">
<span style="position: relative; display: flex">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v10M8 9l4 4 4-4"></path><rect x="4" y="15" width="16" height="6" rx="2"></rect></svg>
<span style="position: absolute; top: -4px; right: -9px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #6EA8FF; color: #0B0E13; font: 700 10px/16px 'IBM Plex Sans', sans-serif; text-align: center">2</span>
</span>
Downloads
</a>
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: 0; color: #9AA3AF; font: 500 11px 'IBM Plex Sans', sans-serif; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path></svg>
Fontes
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { cat: 'Tudo', sort: 'seeders' };
  renderVals() {
    const cats = ['Tudo', 'Filmes', 'Séries', 'Software', 'Livros', 'Música'];
    const all = [
      { title: 'Night of the Living Dead (1968) Remaster 1080p', cat: 'Filmes', size: '3,4 GB', src: 'Internet Archive', s: 2418, l: 187, ageH: 26 },
      { title: 'Ubuntu 24.04.3 Desktop amd64', cat: 'Software', size: '6,1 GB', src: 'Jackett · local', s: 1902, l: 344, ageH: 70 },
      { title: 'Sintel (2010) 4K', cat: 'Filmes', size: '5,8 GB', src: 'Internet Archive', s: 1120, l: 63, ageH: 9 },
      { title: 'Flash Gordon (1954) — temporada completa', cat: 'Séries', size: '9,2 GB', src: 'Internet Archive', s: 860, l: 120, ageH: 5 },
      { title: 'Blender 4.5 LTS — Linux x64', cat: 'Software', size: '340 MB', src: 'Jackett · local', s: 640, l: 22, ageH: 48 },
      { title: 'Machado de Assis — obra completa (EPUB)', cat: 'Livros', size: '48 MB', src: 'Internet Archive', s: 512, l: 9, ageH: 120 },
      { title: 'Big Buck Bunny 4K 60fps', cat: 'Filmes', size: '642 MB', src: 'Internet Archive', s: 498, l: 14, ageH: 3 },
      { title: 'Debian 13.1 netinst', cat: 'Software', size: '754 MB', src: 'Jackett · local', s: 410, l: 31, ageH: 30 },
      { title: 'Musopen — gravações clássicas (FLAC)', cat: 'Música', size: '18,6 GB', src: 'Academic Torrents', s: 233, l: 58, ageH: 14 }
    ];
    const sort = this.state.sort;
    const cat = this.state.cat;
    const list = all
      .filter((i) => cat === 'Tudo' || i.cat === cat)
      .sort((a, b) => (sort === 'seeders' ? b.s - a.s : a.ageH - b.ageH));
    const fmt = (n) => n.toLocaleString('pt-BR');
    const age = (h) => (h < 24 ? 'há ' + h + ' h' : 'há ' + Math.round(h / 24) + ' d');
    const chipBase = "display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; ";
    return {
      cats: cats.map((c) => {
        const on = c === cat;
        return {
          label: c,
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ cat: c }),
          style: chipBase + (on
            ? 'font-weight: 600; background: #6EA8FF; color: #0B0E13; border: 1px solid #6EA8FF'
            : 'font-weight: 500; background: #171B22; color: #C9CED6; border: 1px solid #2A303A')
        };
      }),
      items: list.map((i, k) => ({
        title: i.title,
        rank: String(k + 1),
        meta: i.cat + ' · ' + i.size + ' · ' + i.src,
        seeds: fmt(i.s),
        leech: fmt(i.l),
        age: age(i.ageH),
        dlLabel: 'Baixar ' + i.title
      })),
      empty: list.length === 0,
      count: String(list.length),
      sortLabel: sort === 'seeders' ? 'Mais semeados' : 'Mais novos',
      toggleSort: () => this.setState({ sort: sort === 'seeders' ? 'novos' : 'seeders' })
    };
  }
}
</script>
</body>
</html>
